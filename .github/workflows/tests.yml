name: PHPUnit Tests

on:
    push:
    pull_request:

jobs:
    tests:
        name: Symfony Tests (PHP 8.4)
        runs-on: ubuntu-latest

        services:
            mariadb:
                image: mariadb:11.4
                env:
                    MARIADB_ROOT_PASSWORD: root_test_password
                    MARIADB_DATABASE: currency_converter_test
                    MARIADB_USER: currency_user
                    MARIADB_PASSWORD: test_password
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="healthcheck.sh --connect --innodb_initialized"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=10

        env:
            APP_ENV: test
            APP_DEBUG: 0
            APP_SECRET: ci_test_secret_not_for_production
            DEFAULT_URI: "http://localhost:8000"
            DATABASE_URL: "mysql://currency_user:test_password@127.0.0.1:3306/currency_converter?serverVersion=mariadb-11.4.0&charset=utf8mb4"

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up PHP 8.4
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: ctype, iconv, intl, mbstring, pdo_mysql, xml
                  coverage: none
                  tools: composer:v2

            - name: Validate Composer configuration
              run: composer validate --no-check-publish

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php84-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php84-

            - name: Create Symfony environment file
              run: |
                  echo "APP_ENV=test" > .env
                  echo "APP_SECRET=ci_test_secret_not_for_production" >> .env

            - name: Install PHP dependencies
              run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

            - name: Prepare test database
              run: php bin/console doctrine:migrations:migrate --env=test --no-interaction

            - name: Run PHPUnit tests
              run: php bin/phpunit --testdox
